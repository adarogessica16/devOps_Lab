apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: devops-lab
type: Opaque
# INSTRUCCIONES:
# 1. Copia este archivo: cp db-secret.example.yaml db-secret.yaml
# 2. Codifica tus valores: echo -n "tu_valor" | base64
# 3. Reemplaza los valores de ejemplo abajo
# 4. Aplica: kubectl apply -f db-secret.yaml
data:
  POSTGRES_USER: <base64-encoded-user>
  POSTGRES_PASSWORD: <base64-encoded-password>
  POSTGRES_DB: <base64-encoded-database>